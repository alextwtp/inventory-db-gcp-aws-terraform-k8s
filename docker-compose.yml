services:
  mysql:
    image: mysql:8.4
    container_name: my-app-repo  
    env_file:
      - .env
    ports:
      # Map host port 3307 to MySQL container port 3306
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      # Keep MySQL data after the container is removed.
      - mysql_data:/var/lib/mysql

  app:
    build: .
    container_name: inventory-app
    depends_on:
      mysql: 
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
    ports:
      - "80:80"
    command: uvicorn app.main:app --host 0.0.0.0 --port 80

volumes:
  mysql_data: