apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: inventory-app-hpa
  namespace: inventory
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inventory-app-deployment
  minReplicas: 2      # Minimum number of Pods normally
  maxReplicas: 5      # Maximum number of Pods during high load
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50 # When the average CPU utilization exceeds 50% of the request (100m), trigger scaling